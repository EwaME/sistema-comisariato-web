# CrediFlow — contrato de datos (OpenAPI 3.0). Se sirve con Swagger UI en /api-docs.
# Generado a partir de las colecciones de Firestore usadas en src/services/.
openapi: 3.0.3
info:
  title: CrediFlow — Contrato de datos y API
  version: 1.0.0
  description: |-
    CrediFlow (Sistema Comisariato Web) **no tiene un servidor REST propio**: el frontend React habla directamente con **Firebase** mediante su SDK. Este documento describe ese backend en formato OpenAPI:

    | Referencia | En CrediFlow |
    |---|---|
    | Base de datos (PostgreSQL) | **Cloud Firestore** (NoSQL, colecciones y documentos) |
    | ORM (SQLAlchemy) | SDK de Firestore, encapsulado por entidad en `src/services/` |
    | Autenticación (JWT) | **Firebase Authentication**: el *ID token* es un JWT firmado |
    | Backend (FastAPI) | **Cloud Functions** (`descontarStockAlAprobar`) + reglas de seguridad de Firestore |

    Cada colección de Firestore se expone como recurso en la **API REST pública de Firestore** (`firestore.googleapis.com`), por eso las rutas de abajo son exactamente las que el SDK invoca por debajo.

    ### Modelos vs. formato del cable
    Los *schemas* de la sección inferior (`Producto`, `Credito`…) describen los **campos lógicos** de cada documento tal como los maneja la aplicación. En el cable, la API REST de Firestore los envuelve en `fields` con valores tipados:

    ```json
    { "fields": { "nombre": {"stringValue": "Arroz 1 kg"}, "stock": {"integerValue": "40"}, "activo": {"booleanValue": true} } }
    ```

    ### Autenticación y autorización
    Se envía el ID token de Firebase Auth como `Authorization: Bearer <JWT>`. **Qué puede hacer cada usuario lo deciden las reglas de seguridad de Firestore**, no el cliente; los roles (`roles`, `usuarios.rol`) modelan el acceso a las pantallas.

    ### Entornos
    Elige el servidor: **producción** (`comisariato-plataform`, Firestore real) o **desarrollo** (Firebase Emulator Suite en la VM local, proyecto `demo-crediflow`, con datos de prueba). Son backends totalmente independientes: no comparten datos, usuarios ni reglas.

    En el emulador no hay token real: para *Try it out* usa `Bearer owner` (el emulador lo trata como administrador).
servers:
  - url: https://firestore.googleapis.com/v1/projects/{projectId}/databases/(default)/documents
    description: Producción — Cloud Firestore
    variables:
      projectId:
        default: comisariato-plataform
  - url: http://localhost:8082/v1/projects/{projectId}/databases/(default)/documents
    description: Desarrollo — Firestore Emulator (VM local)
    variables:
      projectId:
        default: demo-crediflow
tags:
  - name: Usuarios
    description: Perfiles de acceso. El ID es el correo y se corresponde con el usuario de Firebase Authentication.
  - name: Empleados
    description: Personal del comisariato y su límite de crédito.
  - name: Organización
    description: 'Catálogos organizacionales: cargos, departamentos y roles.'
  - name: Inventario
    description: Categorías, productos, comentarios y solicitudes de compra a proveedores.
  - name: Promociones
    description: Descuentos vigentes sobre el catálogo.
  - name: Créditos
    description: Solicitudes de crédito y sus cuotas. Incluye el trigger de Cloud Functions.
  - name: Reclamos
    description: Reclamos de garantía de clientes.
  - name: Sugerencias
    description: Sugerencias de usuarios (solo lectura).
  - name: Configuración
    description: Parámetros globales, plazos de crédito y políticas de garantía.
  - name: Auditoría
    description: Bitácora de actividad de la plataforma.
security:
  - bearerAuth: []
paths:
  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: |-
        Devuelve los documentos de `usuarios`. Campos lógicos: schema `Usuario`.

        Además del alta, el servicio `cambiarEstadoUsuario` solo cambia `estado`.
      operationId: listar_usuarios
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/orderBy'
      responses:
        '200':
          description: Página de documentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirestoreDocumentList'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
        - Usuarios
      summary: Crear en usuarios
      description: Crea un documento. Con `documentId` se fija el ID (así lo hace la app para `usuarios`); sin él, Firestore lo autogenera.
      operationId: crear_usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: query
          required: false
          schema:
            type: string
          description: ID del documento (correo en minúsculas).
      requestBody:
        required: true
        description: 'Documento en el formato del cable. Campos lógicos: schema `Usuario`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirestoreDocument'
      responses:
        '200':
          description: Documento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirestoreDocument'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/YaExiste'
  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del documento (correo en minúsculas).
        schema:
          type: string
    get:
      tags:
        - Usuarios
      summary: Obtener documento de usuarios
      description: 'Campos lógicos: schema `Usuario`.'
      operationId: obtener_usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirestoreDocument'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags:
        - Usuarios
      summary: Actualizar documento de usuarios
      description: 'Actualiza solo los campos indicados en `updateMask.fieldPaths` (equivale a `updateDoc` del SDK). Campos lógicos: schema `Usuario`.'
      operationId: actualizar_usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: updateMask.fieldPaths
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Campos a modificar.
        - name: currentDocument.exists
          in: query
          required: false
          schema:
            type: boolean
          description: '`true` evita crear el documento si no existe.'
      requestBody:
        required: true
        description: 'Documento en el formato del cable. Campos lógicos: schema `Usuario`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirestoreDocument'
      responses:
        '200':
