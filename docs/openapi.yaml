      security:
        - bearerAuth: []
      parameters:
        - name: updateMask.fieldPaths
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Campos a modificar.
        - name: currentDocument.exists
