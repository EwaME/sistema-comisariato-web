          $ref: '#/components/responses/SinPermiso'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token de Firebase Authentication (`await auth.currentUser.getIdToken()`). Caduca a la hora.
  parameters:
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 300
      description: Documentos por página.
    pageToken:
      name: pageToken
      in: query
      schema:
        type: string
      description: Token de la página anterior (`nextPageToken`).
    orderBy:
      name: orderBy
      in: query
      schema:
        type: string
        example: fechaRegistro desc
      description: Campo y dirección de orden.
  responses:
    NoAutenticado:
      description: Falta el token o es inválido / expiró.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FirestoreError'
    SinPermiso:
      description: Las reglas de seguridad de Firestore rechazan la operación (`PERMISSION_DENIED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FirestoreError'
    NoEncontrado:
      description: El documento no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FirestoreError'
    YaExiste:
      description: Ya existe un documento con ese ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FirestoreError'
  schemas:
    FirestoreValue:
      type: object
      description: 'Valor tipado de Firestore. Exactamente una de estas claves: `stringValue`, `integerValue` (como string), `doubleValue`, `booleanValue`, `timestampValue` (RFC 3339), `nullValue`, `arrayValue{values[]}` o `mapValue{fields{}}`.'
      additionalProperties: true
      example:
        stringValue: Arroz 1 kg
    FirestoreDocument:
      type: object
      description: Documento de Firestore en el formato del cable. Los campos lógicos de cada colección están en su schema (p. ej. `Producto`) y aquí viajan dentro de `fields`, codificados como `FirestoreValue`.
      properties:
        name:
          type: string
          description: 'Ruta completa: `projects/{projectId}/databases/(default)/documents/{colección}/{id}`.'
          readOnly: true
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FirestoreValue'
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
    FirestoreDocumentList:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FirestoreDocument'
        nextPageToken:
          type: string
          description: Enviar como `pageToken` para pedir la siguiente página.
    FirestoreError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
              description: p. ej. `PERMISSION_DENIED`, `NOT_FOUND`, `UNAUTHENTICATED`.
    Usuario:
      description: Perfil de acceso al sistema. El ID del documento es el correo en minúsculas y coincide con el usuario de Firebase Authentication.
      required:
        - uid
        - correo
        - rol
        - estado
      properties:
        uid:
          type: string
          description: Igual al correo en minúsculas.
        empleadoId:
          type: string
          description: Referencia a `empleados/{empleadoId}`.
        nombre:
          type: string
        correo:
          type: string
          format: email
        usuario:
          type: string
          description: Nombre de usuario generado a partir de nombres/apellidos/DNI.
        rol:
          type: array
          items:
            type: string
          description: Roles asignados (ver colección `roles`). Un empleado siempre incluye `EMPLEADO`.
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
        plataforma:
          type: string
          enum:
            - APP MÓVIL
            - WEB Y MÓVIL
          description: Se eleva a `WEB Y MÓVIL` al asignar un rol web.
        passwordChanged:
          type: boolean
          description: '`false` obliga a cambiar la contraseña temporal en el primer acceso.'
        fotoUrl:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Empleado:
      description: Empleado del comisariato. Su `limiteCredito` acota el crédito total que puede tener activo.
      required:
        - empleadoId
        - nombres
        - apellidos
        - dni
        - correo
        - estado
      properties:
        empleadoId:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        dni:
          type: string
        departamento:
          type: string
          description: Nombre del departamento (`departamentos.nombre`).
        cargo:
          type: string
          description: Nombre del cargo (`cargos.nombre`).
        correo:
          type: string
          format: email
        telefono:
          type: string
        fechaIngreso:
          type: string
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
        salario:
          type: number
        limiteCredito:
          type: number
          description: Calculado a partir del salario y `configuraciones.porcSueldo`.
        fotoUrl:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Cargo:
      description: Puesto de trabajo. El ID es el código en mayúsculas.
      required:
        - codigo
        - nombre
        - estado
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Departamento:
      description: Departamento organizacional. El ID es el código.
      required:
        - codigo
        - nombre
        - estado
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Rol:
      description: Rol de acceso. El ID es el nombre en mayúsculas.
      required:
        - nombre
        - estado
      properties:
        nombre:
          type: string
        entorno:
          type: string
          description: Plataforma donde aplica el rol (web, móvil o ambos).
        descripcion:
          type: string
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Categoria:
      description: Categoría de productos. `cantidadProductos` que muestra la interfaz se calcula al vuelo y no se almacena.
      required:
        - categoriaId
        - nombre
      properties:
        categoriaId:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        imagenUrl:
          type: string
        estado:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Producto:
      description: 'Producto del inventario. Nunca se borra: se inhabilita con `activo=false` (borrado lógico). Cuando un crédito se aprueba, la Cloud Function `descontarStockAlAprobar` descuenta `stock` y suma `cantidadVendida`.'
      required:
        - productoId
        - nombre
        - precioContado
        - precioCredito
        - categoriaId
        - stock
        - activo
      properties:
        productoId:
          type: string
        nombre:
          type: string
        nombreNormalizado:
          type: string
          description: Nombre en minúsculas y sin espacios extremos, para búsquedas.
        descripcion:
          type: string
        precioContado:
          type: number
        precioCredito:
          type: number
        categoria:
          type: string
          description: Nombre de la categoría (desnormalizado).
        categoriaId:
          type: string
          description: Referencia a `categorias/{categoriaId}`.
        stock:
          type: integer
        cantidadVendida:
          type: integer
        activo:
          type: boolean
        rate:
          type: number
          description: Calificación promedio, calculada a partir de los comentarios.
        garantiaDias:
          type: integer
          description: Excluyente con `garantiaMeses`.
          nullable: true
        garantiaMeses:
          type: integer
          description: Excluyente con `garantiaDias`.
          nullable: true
        imagenFrontalUrl:
          type: string
        imagenLateralUrl:
          type: string
        imagenTraseraUrl:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    ComentarioProducto:
      description: Comentario de un cliente sobre un producto (subcolección `productos/{productoId}/comentarios`). La moderación lo oculta con `visible=false`.
      properties:
        email:
          type: string
        fotoUrl:
          type: string
        calificacion:
          type: integer
        texto:
          type: string
        fecha:
          type: string
          format: date-time
        visible:
          type: boolean
        fechaModificacion:
          type: string
          format: date-time
      type: object
    Promocion:
      description: Promoción de descuento sobre el catálogo.
      required:
        - promocionId
        - nombre
        - tipo
        - valorDescuento
        - fechaInicio
        - fechaFin
        - estado
      properties:
        promocionId:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        tipo:
          type: string
          description: Tipo de descuento (porcentaje o monto fijo).
        valorDescuento:
          type: number
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        estado:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
      type: object
    ItemCompra:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        cantidad:
          type: integer
    SolicitudCompra:
      description: 'Solicitud de reposición de inventario a un proveedor (colección `comprasEwa`, ID autogenerado). Ciclo: `PENDIENTE` → `ACEPTADO` → `INGRESADO`, o `RECHAZADO` con `motivoRechazo`. Al pasar a `INGRESADO` se suma la cantidad al `stock` de cada producto.'
      required:
        - estado
        - items
      properties:
        compraId:
          type: string
        estado:
          type: string
          enum:
            - PENDIENTE
            - ACEPTADO
            - RECHAZADO
            - INGRESADO
        idProveedor:
          type: string
        nombreProveedor:
          type: string
        solicitadoPor:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCompra'
        motivoRechazo:
          type: string
        fecha:
          type: string
          format: date-time
        fechaCreacion:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time
      type: object
    Credito:
      description: Solicitud de crédito para comprar un producto. La crea la app móvil; la web solo la revisa (`Pendiente` → `En revisión` → `Aprobado`/`Rechazado`). Al pasar a `Aprobado` se dispara la Cloud Function `descontarStockAlAprobar`.
      required:
        - estado
        - productoId
        - cantidad
        - cuotaMensual
        - plazoMeses
      properties:
        usuarioId:
          type: string
        empleadoId:
          type: string
        usuario:
          type: string
        productoId:
          type: string
          description: Referencia a `productos/{productoId}`.
        nombreProducto:
          type: string
        imagenProductoURL:
          type: string
        cantidad:
          type: integer
          description: Unidades del producto solicitadas.
        plazoMeses:
          type: integer
        cuotaMensual:
          type: number
        cuotasPagadas:
          type: integer
        estado:
          type: string
          description: '`Pendiente`, `En revisión`, `Aprobado` o `Rechazado`.'
        revisadoPor:
          type: string
        revisorEmail:
          type: string
        revisorFotoTemp:
          type: string
        Respuesta:
          type: string
          description: Observaciones del revisor.
        fechaRegistro:
          type: string
          format: date-time
        fechaInicioRevision:
          type: string
          format: date-time
        fechaRevision:
          type: string
          format: date-time
      type: object
    Cuota:
      description: Cuota mensual de un crédito. La genera la app móvil; la web las consulta filtrando por `creditoId`.
      required:
        - creditoId
      additionalProperties: true
      properties:
        creditoId:
          type: string
          description: Referencia a `creditos/{creditoId}`.
      type: object
    Reclamo:
      description: Reclamo de garantía de un cliente. Lo crea la app móvil; la web lo revisa (`Pendiente` → `En revisión` → `Revisado`).
      required:
        - estado
      additionalProperties: true
      properties:
        solicitante:
          type: string
        asunto:
          type: string
        estado:
          type: string
          enum:
            - Pendiente
            - En revisión
            - Revisado
        fechaEmision:
          type: string
          format: date-time
        evidenciaUrl:
          type: string
        respuesta:
          type: string
        revisadoPor:
          type: string
        revisorEmail:
          type: string
        revisorFotoTemp:
          type: string
        fechaInicioRevision:
          type: string
          format: date-time
      type: object
    Sugerencia:
      description: Sugerencia enviada por un usuario. La web solo la lista.
      properties:
        nombreUsuario:
          type: string
        fotoUsuario:
          type: string
        asunto:
          type: string
        descripcion:
          type: string
        fechaRegistro:
          type: string
          format: date-time
      type: object
    ConfiguracionGlobal:
      description: 'Parámetros generales del sistema. Único documento: `configuraciones/config_global`.'
      properties:
        tiempoInactividad:
          type: integer
