        StockMinimoAviso:
          type: integer
          description: Stock a partir del cual se avisa de bajo inventario.
        StockMinimoCierre:
          type: integer
          description: Stock a partir del cual la Cloud Function desactiva el producto.
        CorreoNotificaciones:
          type: string
          format: email
        mensajeAprobado:
          type: string
        mensajeRechazado:
          type: string
        mensajeEspera:
          type: string
      type: object
    PlazoCredito:
      description: Plazo de crédito disponible (subcolección `configuraciones/config_global/plazos`, ID `PLZ-nn`).
      required:
        - plazoId
        - plazoMeses
      properties:
        plazoId:
          type: string
        plazoMeses:
          type: integer
        fechaCreacion:
          type: string
          format: date-time
      type: object
    GarantiaConfig:
      description: Política de garantía (subcolección `configuraciones/config_global/garantias`, ID `GAR-nn`).
      required:
        - garantiaId
