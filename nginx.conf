server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión para JS/CSS/HTML servidos por Vite
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agresivo para assets con hash en el nombre (Vite los genera así)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: react-router-dom maneja las rutas del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
