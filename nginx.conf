server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Detrás de Caddy (HTTPS) las redirecciones deben ser relativas,
    # si no nginx armaría URLs con http:// y el puerto interno
    absolute_redirect off;
    server_tokens off;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión para JS/CSS/HTML servidos por Vite
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/yaml image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck para Docker y monitoreo (no pasa por el fallback de SPA)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Documentación de la API (Swagger UI + openapi.yaml), generada en el build
    location = /api-docs {
        return 301 /api-docs/;
    }
    location /api-docs/ {
        # Sin caché agresivo: la especificación cambia con cada despliegue
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html =404;
    }

    # Cache agresivo para assets con hash en el nombre (Vite los genera así)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback de SPA: react-router-dom maneja las rutas del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
