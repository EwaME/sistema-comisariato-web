# Entorno de PRODUCCIÓN — contenedor "crediflow-prod" en 127.0.0.1:8080
# Las variables VITE_FIREBASE_* se leen del archivo .env de este directorio
# (proyecto Firebase de producción). Ver .env.example y DEPLOY.md.
name: crediflow-prod

services:
  web:
    image: crediflow-web:prod
    container_name: crediflow-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    # Solo loopback: Docker publica puertos saltándose ufw, así que exponerlo en
    # 0.0.0.0 dejaría el 8080 abierto a Internet. Caddy es el único punto de entrada.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
